# Shown to the LLM for "why this role" / fit questions (ground answers in resume + GitHub context)
target_role_requirements: |
  We are automating Scaler's end-to-end learner experience using AI agents that are
  always-on, deeply personal, and fully autonomous. You will own real production
  systems that thousands of learners interact with daily.

  What You'll Build
  1. Autonomous onboarding agent with zero human intervention from first login to first class
  2. Conversational agents (text + voice) for learner check-ins, nudges, and doubt resolution
  3. Stateful agentic pipelines using LangGraph etc. for multi-step reasoning workflows
  4. Production API serving for AI agents: streaming, low-latency, concurrent-safe
  5. Eval frameworks and feedback loops to continuously measure and improve agent quality
  6. End-to-end test suites: unit, integration, and adversarial red-teaming for agents

  What We're Looking For — Technical
  - Python: production-quality, async, typed; not just scripts
  - LLM APIs: OpenAI, Claude, Gemini; function calling, context management, cost awareness
  - Agentic frameworks: LangGraph, LangChain, LlamaIndex, CrewAI, or AutoGen
  - Voice AI: Vapi, Retell, ElevenLabs, Deepgram, or Twilio
  - RAG pipelines: vector DBs (Pinecone, Chroma, Weaviate), chunking, retrieval strategies

  Mindset
  - You have shipped an AI agent to real users, not just a notebook
  - You care how the system feels, not just whether it technically works
  - You ship fast, flag blockers early, and own outcomes end-to-end

  What You'll Get
  - Your code ships to real learners, not a staging environment
  - Full ownership of a production AI system from day one

why_good_fit:
